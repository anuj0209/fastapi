apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  labels:
    app: model-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
    spec:
      containers:
        - name: model-server
          image: model-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: model-storage
              mountPath: /models
            - name: model-config
              mountPath: /model-config
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc
        - name: model-config
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: model-server
spec:
  type: NodePort
  selector:
    app: model-server
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
